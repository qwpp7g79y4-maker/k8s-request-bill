[package]
name = "k8s-request-bill"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Offline overprovisioning of Kubernetes requests vs usage from kubectl JSON"
readme = "README.md"
repository = "https://github.com/qwpp7g79y4-maker/k8s-request-bill"
documentation = "https://github.com/qwpp7g79y4-maker/k8s-request-bill"
keywords = ["kubernetes", "kubectl", "cost", "requests", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "*-plugin/"]

[lib]
name = "k8s_request_bill"
path = "src/lib.rs"

[[bin]]
name = "k8s-request-bill"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
rust_decimal = "1.43.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
